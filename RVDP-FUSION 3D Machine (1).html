<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RVDP-FUSION 3D Machine</title>
<style>
:root{--bg:#eef0ea;--panel:#fffefa;--ink:#1c2a2d;--mute:#5d6e70;--line:#c3ccc8;--acc:#b8651b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1819;--panel:#112326;--ink:#e4efef;--mute:#8fa6a8;--line:#2c4a4c;--acc:#f0a050}}
:root[data-theme="dark"]{--bg:#0b1819;--panel:#112326;--ink:#e4efef;--mute:#8fa6a8;--line:#2c4a4c;--acc:#f0a050}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px 14px 26px}
h1{font:700 21px/1.2 ui-monospace,"SF Mono",Consolas,monospace;margin:0 0 2px}
.sub{color:var(--mute);margin:0 0 12px;font-size:14px}
#stage{position:relative;height:min(68vh,600px);min-height:380px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(ellipse at 50% 35%,#1d3a40 0%,#0a1417 75%);touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}canvas{display:block;width:100%;height:100%}
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font:11px ui-monospace,Consolas,monospace;color:#e4efef;background:rgba(8,20,22,.78);border:1px solid #3a6a70;border-radius:10px;padding:1px 7px;white-space:nowrap;pointer-events:none}
.lb.sel{border-color:#f0a050;color:#ffd9a8}
.hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:#9fb8ba;pointer-events:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center}
button{font:inherit;font-size:14px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--acc)}button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.sp{flex:1}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h2{margin:0;font-size:18px}.card .s{font:13px ui-monospace,Consolas,monospace;color:var(--acc);margin:2px 0 6px}.card p{margin:0;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>RVDP-FUSION · The Machine in 3D</h1>
<p class="sub">Bus safety unit with the lid cut away. Drag to rotate, scroll or pinch to zoom, tap any part for details.</p>
<div id="stage"><span class="hint">left-drag rotate · right-drag move · scroll zoom · tap a part</span></div>
<div class="bar" id="bar">
<button data-st="0" class="on"><i class="dot" style="background:#2e9e6b"></i>Safe</button><button data-st="1"><i class="dot" style="background:#e6c23a"></i>Warning</button><button data-st="2"><i class="dot" style="background:#f08c3c"></i>High risk</button><button data-st="3"><i class="dot" style="background:#ff5a60"></i>Critical</button>
<span class="sp"></span><button id="bLid" class="on">Glass lid</button><button id="bLab" class="on">Labels</button><button data-sp="0" class="on">Rotate: Off</button><button data-sp="0.0007">Slow</button><button data-sp="0.0022">Normal</button><button id="bReset">Reset view</button>
</div>
<div class="card" id="info"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

 [-2.0,-.2,1.8].forEach((z,i)=>B(g,2.2,1.4,i?1.6:1.8,0xc9cdd1,3.1,1.1,z,MET));[-.9,.5].forEach(x=>B(g,.8,.4,.9,0xb0b4b8,x,.65,2.4,MET));
